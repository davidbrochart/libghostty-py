name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Release workflow run whose existing wheels should be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - name: windows-x86_64
            os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: ghostty
        shell: python
        run: |
          import os
          import tomllib

          with open("pyproject.toml", "rb") as config:
              version = tomllib.load(config)["tool"]["libghostty"]["vt-version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag=vt-{version}", file=output)
      - uses: actions/checkout@v7
        with:
          repository: ghostty-org/ghostty
          ref: ${{ steps.ghostty.outputs.tag }}
          path: ghostty-src
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_PASS_LINUX: GHOSTTY_SRC
          GHOSTTY_SRC: ghostty-src
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  publish:
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Check the source release run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess

          run = json.loads(subprocess.check_output([
              'gh', 'run', 'view', os.environ['RELEASE_RUN_ID'],
              '--repo', os.environ['GITHUB_REPOSITORY'],
              '--json', 'event,headBranch,jobs,workflowName',
          ]))
          assert run['event'] == 'push' and run['workflowName'] == 'CI', run
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', run['headBranch']), run
          builds = [job for job in run['jobs'] if job['name'].startswith('build (')]
          assert len(builds) == 5 and all(job['conclusion'] == 'success' for job in builds), builds
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run_id || github.run_id }}
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        if: github.event_name != 'workflow_dispatch'
        with:
          files: dist/*.whl
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Manual recovery skips Sigstore; ordinary releases retain attestations.
          attestations: ${{ github.event_name != 'workflow_dispatch' }}
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
