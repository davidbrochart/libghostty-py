[build-system]
requires = ["setuptools>=77"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "libghostty-py"
dynamic = ["version"]
description = "Python bindings for libghostty"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE.ghostty"]
authors = [{ name = "pyghostty contributors" }, { name = "libghostty-py contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ["cffi"]

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "cibuildwheel~=3.4",
  "pytest",
]

[project.urls]
Upstream = "https://github.com/AnswerDotAI/pyghostty"

[tool.setuptools.dynamic]
version = { attr = "ghostty.__version__" }

[tool.setuptools.packages.find]
include = ["ghostty"]

[tool.setuptools.package-data]
ghostty = ["_lib/*"]

[tool.libghostty]
vt-version = "1.0.0"
zig-version = "0.17.0"

[tool.cibuildwheel]
before-build = "python {project}/install_zig.py"
build = "cp311-*"
skip = "*-musllinux_* *-win32"
test-requires = ["pytest", "setuptools>=77", "nodejs-wheel==24.19.0"]
test-command = "python {project}/tests/run_ci.py {project}/tests"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
